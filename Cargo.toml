[workspace]
members = [
    "authsmith-core",
    "authsmith-password",
    "authsmith-oauth",
    "authsmith-p2p",
    "authsmith-axum",
    "authsmith-db",
    "authsmith-notify",
    "authsmith-dashboard",
    "examples/basic-axum",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/RayburnCode/authsmith"
homepage   = "https://github.com/RayburnCode/authsmith"
readme     = "README.md"
categories = ["web-programming", "authentication", "network-programming"]

# Shared dependency versions — individual crates opt in with `{ workspace = true }`.
[workspace.dependencies]
# Internal crates
authsmith-core     = { path = "authsmith-core" }
authsmith-password = { path = "authsmith-password" }
authsmith-notify   = { path = "authsmith-notify" }

# Serialization
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"

# Errors & logging
thiserror   = "2"
tracing     = "0.1"

# Async
async-trait = "0.1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Security
secrecy     = "0.10"
rand        = "0.9"
base64      = "0.22"
argon2      = "0.5"

# HTTP / web
axum        = { version = "0.8", features = ["macros"] }
http        = "1"

# Database
sqlx        = { version = "0.8", features = ["runtime-tokio", "macros", "chrono"] }

# OAuth
oauth2      = "4"
reqwest     = { version = "0.12", features = ["json"], default-features = false }

# Email
lettre      = { version = "0.11.21", features = ["tokio1-native-tls", "smtp-transport", "builder"] }