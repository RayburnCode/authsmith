[package]
name    = "multi-tenant"
description = "AuthSmith multi-tenant example: per-tenant user and session isolation"
version.workspace = true
edition           = "2021"
publish           = false

[[bin]]
name = "multi-tenant"
path = "src/main.rs"

[dependencies]
authsmith-core     = { workspace = true, features = ["session"] }
authsmith-axum     = { path = "../../authsmith-axum" }
authsmith-password = { workspace = true }

# Web + async
axum  = { workspace = true }
tokio = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Utilities
async-trait        = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = "0.3"
